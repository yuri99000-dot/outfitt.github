<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘뭐입지? MY DAILY STYLIST</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1F3;--card:#fff;--ink:#2A2230;--sub:#6F6475;--line:#E3DAE5;--ok:#2E8B6A;--mid:#D9962B;--bad:#C8456B;--gold:#E8B84A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121B;--card:#221B28;--ink:#F1EAF3;--sub:#A99DB0;--line:#3A2F42;--ok:#4CC49A;--mid:#F0B24A;--bad:#F0698F}}
:root[data-theme="dark"]{--bg:#17121B;--card:#221B28;--ink:#F1EAF3;--sub:#A99DB0;--line:#3A2F42;--ok:#4CC49A;--mid:#F0B24A;--bad:#F0698F}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.5}
header{max-width:480px;margin:0 auto;padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:flex-end}
header small{font-size:10px;letter-spacing:.18em;color:var(--sub);display:block}
header h1{font-size:24px;font-weight:900;margin:0;line-height:1.2}
.pro{background:var(--gold);color:#3A2A00;font-weight:900;font-size:12px;border-radius:999px;padding:3px 10px}
main{max-width:480px;margin:0 auto;padding:8px 16px 110px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:8px 0 7px;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400}
nav button[aria-current="page"]{color:var(--ink);font-weight:900}
button:focus-visible,input:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.sub{font-size:13px;color:var(--sub);margin:0 0 10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn{border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.line{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{font-size:12px;padding:6px 10px;border-radius:9px}
.btn:disabled{opacity:.5}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:900;line-height:1.2}
.kpi span{font-size:12px;color:var(--sub)}
.kpi .w b{color:var(--bad)}
.pbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.pbar i{display:block;background:var(--ok)}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--bad)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.li:first-of-type{border-top:0}
.meta{font-size:12px;color:var(--sub)}
.up{border:2px dashed var(--line);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:12px;background:var(--card)}
.up .cam{font-size:34px}
.up h2{margin:4px 0}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#prev img{width:84px;height:84px;object-fit:cover;border-radius:12px;margin-top:10px}
.steps{margin-top:12px;text-align:left;font-size:14px;display:inline-block}
.res{border-left:6px solid var(--ok);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tags span{display:inline-block;background:var(--bg);border-radius:999px;font-size:12px;padding:2px 10px;margin:4px 4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.em{font-size:38px;display:block;line-height:1.3}
.it img{width:100%;height:70px;object-fit:cover;border-radius:10px}
.it b{display:block;font-size:14px}
.tag{font-size:11px;background:var(--bad);color:#fff;border-radius:4px;padding:0 5px}
.out{display:flex;gap:8px;justify-content:space-around;margin:6px 0 12px}
.out div{text-align:center;font-size:13px;flex:1}
.out .em{font-size:44px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
.note{font-size:11px;color:var(--sub);text-align:center;margin-top:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.tf{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;border-radius:10px;padding:8px 10px;margin:2px 0 10px}
.tag.d{background:var(--mid)}
</style>
</head>
<body>
<header><div><small>MY DAILY STYLIST</small><h1>오늘뭐입지?</h1></div><span class="pro">♛ PRO</span></header>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<script>
let nid=100,busy=false,aiN=0,saved=[],sold=[],tt;
let C=[
{id:1,name:"화이트 셔츠",cat:"상의",style:["미니멀"],season:"사계절",p:39000,w:31,d:3,emoji:"👔"},
{id:2,name:"연청 데님",cat:"하의",style:["캐주얼"],season:"사계절",p:79000,w:34,d:2,emoji:"👖"},
{id:3,name:"그레이 맨투맨",cat:"상의",style:["캐주얼","스트릿"],season:"봄가을",p:45000,w:28,d:5,emoji:"👕"},
{id:4,name:"블랙 슬랙스",cat:"하의",style:["포멀","미니멀"],season:"사계절",p:65000,w:24,d:9,emoji:"👖"},
{id:5,name:"니트 가디건",cat:"상의",style:["러블리","클래식"],season:"봄가을",p:69000,w:9,d:40,emoji:"🧶"},
{id:6,name:"레이스 블라우스",cat:"상의",style:["러블리"],season:"봄가을",p:55000,w:2,d:150,emoji:"👚"},
{id:7,name:"플리츠 스커트",cat:"하의",style:["러블리","클래식"],season:"봄가을",p:52000,w:6,d:70,emoji:"👗"},
{id:8,name:"카고 팬츠",cat:"하의",style:["스트릿","캐주얼"],season:"사계절",p:69000,w:3,d:130,emoji:"👖"},
{id:9,name:"트렌치코트",cat:"아우터",style:["클래식","포멀"],season:"봄가을",p:189000,w:7,d:55,emoji:"🧥"},
{id:10,name:"가죽 자켓",cat:"아우터",style:["스트릿","캐주얼"],season:"봄가을",p:249000,w:3,d:120,emoji:"🧥"},
{id:11,name:"롱 패딩",cat:"아우터",style:["캐주얼","미니멀"],season:"겨울",p:229000,w:11,d:14,emoji:"🧥"},
{id:12,name:"블레이저",cat:"아우터",style:["포멀","미니멀"],season:"사계절",p:119000,w:15,d:18,emoji:"🧥"},
{id:13,name:"반팔 티",cat:"상의",style:["캐주얼"],season:"여름",p:19000,w:26,d:6,emoji:"👕"},
{id:14,name:"린넨 반바지",cat:"하의",style:["캐주얼"],season:"여름",p:35000,w:1,d:240,emoji:"🩳"}];
const SAMPLES=[
{name:"베이지 트렌치코트",cat:"아우터",color:"베이지",style:["클래식"],season:"봄가을",p:189000,emoji:"🧥"},
{name:"네이비 니트",cat:"상의",color:"네이비",style:["미니멀","클래식"],season:"봄가을",p:59000,emoji:"🧶"},
{name:"블랙 와이드 슬랙스",cat:"하의",color:"블랙",style:["포멀","미니멀"],season:"사계절",p:72000,emoji:"👖"},
{name:"핑크 플라워 스커트",cat:"하의",color:"핑크",style:["러블리"],season:"봄가을",p:48000,emoji:"👗"}];
const OCC={출근:["미니멀","포멀","클래식"],데이트:["러블리","클래식","미니멀"],캠퍼스:["캐주얼","스트릿","미니멀"],모임:["클래식","러블리","포멀"]};
const WX={쌀쌀:{t:"11°",ok:["겨울","봄가을","사계절"],o:1},선선:{t:"18°",ok:["봄가을","사계절"],o:1},더움:{t:"27°",ok:["여름","사계절"],o:0}};
const st={tab:"home",lim:90,cat:"전체",occ:"캠퍼스",wx:"쌀쌀",sf:true,rec:0,anchor:null,photo:null,last:null,sell:null,sp:0,sx:"",file:null,mode:""};
const won=n=>n.toLocaleString("ko-KR")+"원",sum=(a,f)=>a.reduce((t,i)=>t+f(i),0),$=id=>document.getElementById(id);
const chip=(t,on,fn)=>`<button class="chip" aria-pressed="${on}" onclick="${fn}">${t}</button>`;
const media=i=>i.img?`<img src="${i.img}" alt="${i.name}">`:`<span class="em">${i.emoji}</span>`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function go(t){st.tab=t;render();window.scrollTo(0,0)}
function wear(ids){ids.forEach(id=>{const i=C.find(x=>x.id===id);if(i){i.w++;i.d=0}});toast("착용 기록 완료 · 대시보드에 반영됐어요");render()}
function score(i){return(i.style.some(s=>OCC[st.occ].includes(s))?3:0)+(st.sf?Math.min(i.d,240)/80:0)}
function pick(cat){const a=C.find(i=>i.id===st.anchor);if(a&&a.cat===cat)return a;
 const L=C.filter(i=>i.cat===cat&&!i.sale&&WX[st.wx].ok.includes(i.season)).sort((x,y)=>score(y)-score(x));return L.length?L[st.rec%Math.min(3,L.length)]:null}
function outfit(){const o=[pick("상의"),pick("하의")];if(WX[st.wx].o)o.push(pick("아우터"));return o.filter(Boolean)}
function recFor(id){st.anchor=id;st.rec=0;go("rec")}
function save(){const ids=outfit().map(i=>i.id);saved.unshift({id:nid++,ids,occ:st.occ,wx:st.wx});toast("MY 코디에 저장했어요")}
let aiOK=null;
async function getAI(){if(aiOK!==null)return aiOK;try{if(typeof claude==="undefined"||!claude.use)return aiOK=false;const s=await claude.use("sample");if(!s)return aiOK=false;const l=await s.limits().catch(()=>null);return aiOK=(l&&l.images)?s:false}catch(e){return aiOK=false}}
function shrink(f,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok({blob:b,url:c.toDataURL("image/jpeg",.8),cv:c}):no(),"image/jpeg",.85)};im.src=r.result};r.readAsDataURL(f)})}
function dom(c){const w=c.width,h=c.height,d=c.getContext("2d").getImageData(Math.floor(w*.25),Math.floor(h*.25),Math.max(1,Math.floor(w*.5)),Math.max(1,Math.floor(h*.5))).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}r/=n;g/=n;b/=n;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,s=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));let u=0;if(mx!==mn){const q=mx-mn;u=mx===r?((g-b)/q)%6:mx===g?(b-r)/q+2:(r-g)/q+4;u=(u*60+360)%360}
 if(l<.15)return"블랙";if(l>.88&&s<.3)return"화이트";if(s<.12)return l<.4?"차콜":l<.7?"그레이":"라이트그레이";
 if(u<15||u>=345)return l>.7?"핑크":"레드";if(u<40)return l>.65?"베이지":l<.4?"브라운":"오렌지";if(u<65)return l>.65?"아이보리":"옐로우";if(u<165)return l<.35?"카키":"그린";if(u<200)return"민트";if(u<255)return l<.3?"네이비":l>.7?"연청":"블루";if(u<290)return"퍼플";return"핑크"}
const PROMPT=`이 사진은 옷 한 벌이에요. 아래 형식의 JSON 객체만 답하세요.
{"name":"색상과 종류를 합친 한국어 이름 (예: 베이지 트렌치코트)","cat":"상의 또는 하의 또는 아우터","color":"대표 색상 한국어","style":["미니멀, 캐주얼, 포멀, 스트릿, 러블리, 클래식 중 1~2개"],"season":"사계절, 봄가을, 여름, 겨울 중 하나","emoji":"어울리는 이모지 1개"}
사진에 옷이 없으면 {"error":"옷이 아님"} 만 답하세요.`;
const EMO={상의:"👕",하의:"👖",아우터:"🧥"},PR={상의:39000,하의:59000,아우터:129000},STY=["미니멀","캐주얼","포멀","스트릿","러블리","클래식"],SEA=["사계절","봄가을","여름","겨울"];
async function ai(){
 if(busy)return;busy=true;st.last=null;
 const say=t=>{const e=$("aibox");if(e)e.innerHTML=t},sel=$("fcat")?$("fcat").value:"자동";
 let it,mode,img=null;
 try{
  if(st.file){
   say('<div class="steps">⏳ 사진 준비 중…</div>');
   const sh=await shrink(st.file,768);img=sh.url;let ok=false;
   const s=await getAI();
   if(s){
    say('<div class="steps">⏳ Claude가 사진을 분석 중…<br><span class="meta">처음에는 사용 동의 창이 떠요</span></div>');
    try{
     const r=await s.json(PROMPT,{images:[sh.blob],modelTier:"quick"});
     if(r&&r.error){say('<p class="meta">옷 사진이 아닌 것 같아요. 옷이 잘 보이게 다시 찍어 주세요.</p>');busy=false;st.file=null;return}
     const cat=sel!=="자동"?sel:(EMO[r.cat]?r.cat:"상의");
     it={name:String(r.name||r.color+" "+cat),cat,color:String(r.color||""),style:(Array.isArray(r.style)?r.style.filter(x=>STY.includes(x)):[]),season:SEA.includes(r.season)?r.season:"사계절",emoji:String(r.emoji||EMO[cat])};
     if(!it.style.length)it.style=["캐주얼"];mode="Claude AI가 사진을 분석했어요";ok=true;
    }catch(e){if(e&&e.code==="cancelled"){busy=false;return}}
   }
   if(!ok){const color=dom(sh.cv),cat=sel!=="자동"?sel:"상의";it={name:color+" "+cat,cat,color,style:["캐주얼"],season:"사계절",emoji:EMO[cat]};mode=s?"AI 호출이 안 돼서 색상만 자동 추출했어요 (종류는 선택값)":"AI 연결이 없어 색상만 자동 추출했어요 (종류는 선택값)"}
  }else{
   const sm=SAMPLES[aiN++%SAMPLES.length],S=["종류","색상","스타일","계절"];
   for(let k=0;k<S.length;k++){say('<div class="steps">'+S.slice(0,k+1).map((x,j)=>`<div>${j<k?"✓":"⏳"} ${x} 분석${j<k?" 완료":" 중…"}</div>`).join("")+"</div>");await new Promise(r=>setTimeout(r,450))}
   it=Object.assign({},sm);mode="시연용 샘플 결과예요 (사진을 올리면 실제로 분석해요)"}
  it.id=nid++;it.w=0;it.d=0;it.img=img;it.p=it.p||PR[it.cat];
  C.unshift(it);st.last=it;st.mode=mode;st.file=null;busy=false;toast("옷장에 등록했어요");render();
 }catch(e){busy=false;st.file=null;say('<p class="meta">사진을 읽지 못했어요. 다른 사진으로 다시 시도해 주세요.</p>')}}
function pho(e){const f=e.target.files[0];e.target.value="";if(!f)return;st.file=f;ai()}
function est(i){const r=i.w<=3?.6:i.w<=10?.45:.3;return Math.max(1000,Math.round(i.p*r/1000)*1000)}
function openSell(id){const i=C.find(x=>x.id===id);st.sell=id;st.sp=i.sale||est(i);st.sx=`[${i.name}] ${i.cat} · ${i.style[0]}\n구매가 ${won(i.p)}, ${i.w}회 착용했어요. ${i.d}일 동안 보관해서 상태 좋아요.\n직거래 선호하고, 네고는 조금 가능해요.`;render()}
function closeSell(){st.sell=null;render()}
function copyPost(){const i=C.find(x=>x.id===st.sell),t=`${i.name} ${won(+st.sp)}\n${st.sx}`,f=()=>toast("복사가 막혀 있어요. 글을 직접 선택해 복사하세요");try{navigator.clipboard.writeText(t).then(()=>toast("게시글을 복사했어요"),f)}catch(e){f()}}
function listIt(){const i=C.find(x=>x.id===st.sell);i.sale=Math.max(0,Math.round(+st.sp)||est(i));st.sell=null;toast("당근 판매중으로 등록했어요 (시연)");render()}
function unlist(id){delete C.find(x=>x.id===id).sale;toast("판매를 취소했어요");render()}
function soldIt(id){const i=C.find(x=>x.id===id);sold.unshift({name:i.name,v:i.sale});C=C.filter(x=>x.id!==id);saved.forEach(s=>s.ids=s.ids.filter(x=>x!==id));toast("판매 완료 · 옷장 지표가 갱신됐어요");render()}
function dcard(){const sl=C.filter(i=>i.sale);return `<section class="card"><h2>🥕 당근 판매 현황</h2><div class="kpi" style="margin:0"><div><b>${sl.length}벌</b><span>판매중 (예상 ${won(sum(sl,i=>i.sale))})</span></div><div><b>${won(sum(sold,s=>s.v))}</b><span>회수한 금액 (${sold.length}벌)</span></div></div></section>`}
function market(){
 const sl=C.filter(i=>i.sale),cand=C.filter(i=>i.d>=st.lim&&!i.sale);
 return `<div class="kpi"><div><b>${sl.length}벌</b><span>판매중</span></div><div><b>${won(sum(sold,s=>s.v))}</b><span>회수한 금액</span></div></div>
 <section class="card"><h2>판매 후보 (${st.lim}일 이상 안 입음)</h2>${cand.length?cand.map(i=>`<div class="li"><div><b>${i.name}</b><br><span class="meta">${i.d}일 · 추천가 ${won(est(i))}</span></div><button class="btn sm" onclick="openSell(${i.id})">당근 판매</button></div>`).join(""):'<p class="meta">판매 후보가 없어요.</p>'}</section>
 <section class="card"><h2>판매중</h2>${sl.length?sl.map(i=>`<div class="li"><div><b>${i.name}</b><br><span class="meta">${won(i.sale)}</span></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="soldIt(${i.id})">판매 완료</button><button class="btn line sm" onclick="unlist(${i.id})">취소</button></div></div>`).join(""):'<p class="meta">판매중인 옷이 없어요.</p>'}</section>
 <section class="card"><h2>판매 완료</h2>${sold.length?sold.map(s=>`<div class="li"><span>${s.name}</span><b>${won(s.v)}</b></div>`).join(""):'<p class="meta">아직 없어요.</p>'}</section>
 <p class="meta">시연용 화면이라 실제 당근 게시글은 올라가지 않아요. 추천가는 구매가와 착용 횟수로 계산한 예시예요.</p>
 <a class="btn line" style="display:inline-block;text-decoration:none" href="https://www.daangn.com" target="_blank" rel="noopener">당근 열기</a>`}
function sheet(){if(st.sell===null)return "";const i=C.find(x=>x.id===st.sell);
 return `<div class="ov" onclick="if(event.target===this)closeSell()"><div class="sh" role="dialog" aria-label="당근 판매 글 작성"><h2>🥕 당근 판매 글</h2>
 <p class="meta" style="margin:0 0 8px">${i.name} · 구매가 ${won(i.p)} · ${i.w}회 착용 · 추천가 ${won(est(i))}</p>
 <label class="meta" for="sp">판매 가격(원)</label><input class="tf" id="sp" type="number" inputmode="numeric" value="${st.sp}" oninput="st.sp=this.value">
 <label class="meta" for="sx">설명</label><textarea class="tf" id="sx" rows="5" oninput="st.sx=this.value">${st.sx}</textarea>
 <div class="btns" style="justify-content:flex-start"><button class="btn" onclick="listIt()">당근에 올리기 (시연)</button><button class="btn line" onclick="copyPost()">글 복사</button><button class="btn line" onclick="closeSell()">닫기</button></div></div></div>`}
function home(){
 const S=C.filter(i=>i.d>=st.lim),tw=sum(C,i=>i.w),tm=sum(C,i=>i.p),sm=sum(S,i=>i.p),so=[...C].sort((a,b)=>b.w-a.w),k=Math.max(1,Math.round(C.length*.2)),pct=Math.round(sum(so.slice(0,k),i=>i.w)/tw*100);
 return `<div class="kpi"><div><b>${C.length}벌</b><span>내 옷장</span></div><div><b>${(tw/C.length).toFixed(1)}회</b><span>평균 착용 횟수</span></div>
 <div class="w"><b>${S.length}벌 (${Math.round(S.length/C.length*100)}%)</b><span>잠자는 옷</span></div><div class="w"><b>${won(sm)}</b><span>묶인 금액 (${Math.round(sm/tm*100)}%)</span></div></div>
 <section class="card"><h2>착용 쏠림</h2><p class="sub">상위 20%(${k}벌)가 전체 착용의 <b>${pct}%</b>를 차지해요.</p><div class="pbar"><i style="width:${pct}%"></i></div><div class="plab"><span>상위 ${k}벌 ${pct}%</span><span>나머지 ${100-pct}%</span></div></section>
 ${dcard()}<section class="card"><h2>잠자는 옷</h2><label class="meta" for="lim">${st.lim}일 이상 안 입은 옷</label><input type="range" id="lim" min="30" max="240" step="30" value="${st.lim}" onchange="st.lim=+this.value;render()">
 ${S.length?[...S].sort((a,b)=>b.p-a.p).map(i=>`<div class="li"><div><b>${i.name}</b> · ${won(i.p)}<br><span class="meta">${i.d}일 동안 안 입음 · ${i.w}회</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${i.sale?`<button class="btn line sm" onclick="go('market')">판매중</button>`:`<button class="btn sm" onclick="recFor(${i.id})">코디 추천</button><button class="btn line sm" onclick="openSell(${i.id})">당근 판매</button>`}</div></div>`).join(""):'<p class="meta">기준에 해당하는 옷이 없어요.</p>'}</section>`}
function closet(){
 const L=C.filter(i=>st.cat==="전체"||i.cat===st.cat);
 return `<section class="up"><div class="cam">📷</div><h2>옷 사진만 올려주세요!</h2><p class="sub">AI가 종류, 색상, 스타일, 계절을 자동으로 분석해요.</p>
 <div id="aibox"></div><div id="prev"></div>
 <div class="btns"><label class="btn" style="cursor:pointer">📷 사진 올려 AI 분석<input type="file" accept="image/*" hidden onchange="pho(event)"></label><button class="btn line" onclick="ai()">✨ 샘플로 체험</button></div>
 <div class="btns" style="margin-top:8px"><label class="meta" for="fcat">종류</label><select class="tf" id="fcat" style="width:auto;margin:0"><option>자동</option><option>상의</option><option>하의</option><option>아우터</option></select></div>
 <p class="meta" style="margin:10px 0 0">사진을 올리면 종류, 색상, 스타일, 계절을 분석해 옷장에 등록해요. AI를 쓸 수 없는 환경에서는 색상만 자동 추출해요.</p></section>
 ${st.last?`<div class="res"><b>✓ 등록 완료 · ${st.last.name}</b><div class="tags"><span>${st.last.cat}</span><span>${st.last.color}</span>${st.last.style.map(s=>`<span>${s}</span>`).join("")}<span>${st.last.season}</span></div><div class="meta" style="margin-top:6px">${st.mode||""}</div></div>`:""}
 <h2>나의 옷장 <span class="meta">${C.length}벌</span></h2>
 <div class="row">${["전체","상의","하의","아우터"].map(c=>chip(c,st.cat===c,`st.cat='${c}';render()`)).join("")}</div>
 <div class="grid">${L.map(i=>`<div class="it">${media(i)}<b>${i.name}</b><span class="meta">${i.cat} · ${i.style[0]}</span><br><span class="meta">${i.w}회 · ${i.d}일 전</span> ${i.d>=st.lim?'<span class="tag">잠자는 옷</span>':""}${i.sale?'<span class="tag d">당근 판매중</span>':""}<br><button class="btn line sm" style="margin-top:6px" onclick="wear([${i.id}])">입었어요</button></div>`).join("")}</div>`}
function rec(){
 const o=outfit(),sl=o.filter(i=>i.d>=st.lim),a=C.find(i=>i.id===st.anchor);
 return `<h2>상황</h2><div class="row">${Object.keys(OCC).map(k=>chip(k,st.occ===k,`st.occ='${k}';st.rec=0;render()`)).join("")}</div>
 <h2>날씨</h2><div class="row">${Object.keys(WX).map(k=>chip(k+" "+WX[k].t,st.wx===k,`st.wx='${k}';st.rec=0;render()`)).join("")}${chip("잠자는 옷 우선",st.sf,`st.sf=!st.sf;st.rec=0;render()`)}</div>
 ${a?`<p class="meta">선택한 옷: <b>${a.name}</b> <button class="btn line sm" onclick="st.anchor=null;render()">해제</button></p>`:""}
 <section class="card"><h2>오늘의 추천 코디</h2><div class="out">${o.map(i=>`<div>${media(i)}<b>${i.name}</b><span class="meta">${i.d}일 전</span></div>`).join("")}</div>
 <p class="sub">${st.occ} · ${st.wx} ${WX[st.wx].t} 기준이에요.${sl.length?` 잠자는 옷 ${sl.length}벌(${sl.map(i=>i.name).join(", ")})을 다시 꺼냈어요.`:""}</p>
 <div class="btns" style="justify-content:flex-start"><button class="btn" onclick="wear([${o.map(i=>i.id)}])">오늘 입기</button><button class="btn line" onclick="save()">MY 코디 저장</button><button class="btn line" onclick="st.rec++;render()">다시 추천</button></div></section>`}
function mine(){
 if(!saved.length)return '<section class="card"><p class="sub">저장한 코디가 없어요. 코디 추천에서 저장해 보세요.</p><button class="btn" onclick="go(\'rec\')">코디 추천 받기</button></section>';
 return saved.map(s=>{const it=s.ids.map(id=>C.find(i=>i.id===id)).filter(Boolean);
 return `<section class="card"><b>${s.occ} · ${s.wx} ${WX[s.wx].t}</b><div class="out">${it.map(i=>`<div>${media(i)}${i.name}</div>`).join("")}</div>
 <div class="btns" style="justify-content:flex-start"><button class="btn sm" onclick="wear([${s.ids}])">입었어요</button><button class="btn line sm" onclick="saved=saved.filter(x=>x.id!==${s.id});render()">삭제</button></div></section>`}).join("")}
function render(){
 const T=[["home","🏠","홈"],["closet","👗","내 옷장"],["rec","✨","코디 추천"],["mine","💜","MY 코디"],["market","🥕","당근 판매"]];
 $("nav").innerHTML=T.map(t=>`<button ${st.tab===t[0]?'aria-current="page"':""} onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("app").innerHTML=({home,closet,rec,mine,market})[st.tab]()+'<p class="note">MY CLOSET · UI Prototype · AI 분석과 저장은 실제 실행되지 않는 시연 화면입니다.</p>';
 $("sheet").innerHTML=sheet();
 if(st.photo&&st.tab==="closet")$("prev").innerHTML=`<img src="${st.photo}" alt="선택한 옷 사진">`;
}
render();
</script>
</body>
</html>
